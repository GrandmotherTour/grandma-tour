services:
  backend:
    build:
      context: ./grandma-tour-back
    ports:
      - "3000:3000"
    volumes:
      - ./grandma-tour-back:/app
      - /app/node_modules
      # 백엔드가 저장소 루트의 .env 를 읽는다(config/db.js, server.js 가 ../.env 를 본다)
      - ./.env:/.env:ro
    # 비밀번호와 API 키를 compose 에 하드코딩하지 않는다.
    env_file:
      - .env
    environment:
      # 컨테이너 안에서는 호스트 매핑 포트가 아니라 mysql 서비스의 내부 포트를 쓴다.
      # env_file 보다 environment 가 우선하므로 .env 의 127.0.0.1:3307 을 덮는다.
      - DB_HOST=mysql
      - DB_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./grandma-tour-front
    ports:
      - "5173:5173"
    volumes:
      - ./grandma-tour-front:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # for vite hot reload on some OS/docker combo

  mysql:
    image: mysql:8.0
    # 호스트 3306 은 로컬(homebrew) MySQL 이 쓰고 있어 충돌한다.
    # .env 의 DB_PORT=3307 에 맞춘다. 컨테이너 내부는 그대로 3306.
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
      # 첫 기동 시 자동 적용. 파일명 순서대로 실행된다.
      # 주의: mysql_data 볼륨이 이미 있으면 실행되지 않는다.
      #       그때는 마이그레이션을 직접 적용해야 한다:
      #       mysql -h127.0.0.1 -P3307 -uroot -p halmae_tour \
      #         < database/migrations/001_poi_selection.sql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/migrations/001_poi_selection.sql:/docker-entrypoint-initdb.d/02_poi_selection.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
